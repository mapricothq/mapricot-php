name: Release
# Packagist publishes each tag such as v0.1.0 on its own, through its GitHub hook. This checks the version constant.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: grep -qx "    public const VERSION = '${GITHUB_REF_NAME#v}';" src/Client.php
