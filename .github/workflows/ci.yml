name: CI
# Tests against the live API on every push and pull request, and weekly to catch API changes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit
        env:
          MAPRICOT_KEY: ${{ secrets.MAPRICOT_KEY }}
  endpoints:
    # Fails when the API gains an endpoint that this client has no method for.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          curl -fsS https://api.mapricot.com/openapi.json | jq -r '.paths | keys[] | select(startswith("/tiles/") | not) | sub("\\{.*"; "")' | while read -r path; do
            grep -rqF "$path" src || { echo "::error::No method for $path"; exit 1; }
          done
